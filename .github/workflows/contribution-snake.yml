name: Update contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: abidahasan2903
          outputs: |
            github-snake.svg
            github-snake-dark.svg?palette=github-dark

      - name: Publish generated images to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin output || true
          git checkout -B output
          git add github-snake.svg github-snake-dark.svg
          git commit -m "Update contribution snake" || exit 0
          git push --force origin output